# SWAO STATE-04: Single-node Docker Compose — kein Kubernetes, kein Cluster-Orchestrator
# SWAO TF-02: Public Docker Hub Images (postgres:15-alpine, node:20-alpine, nginx:alpine)
version: '3.8'

services:
  # SWAO TF-02: Public Docker Hub Image — nicht aus privater/sovereign Registry
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # SWAO TF-02: FROM node:20-alpine (Docker Hub) im Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    networks:
      - app-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # SWAO TF-02: Multi-stage — node:20-alpine build + nginx:alpine serve (beide Docker Hub)
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
